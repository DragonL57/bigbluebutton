table:
  name: v_mediaPlayer
  schema: public
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: mediaPlayer
  custom_root_fields: {}
select_permissions:
  - role: bbb_client
    permission:
      columns:
        - mediaPlayerId
        - mediaFileId
        - filename
        - contentType
        - fileSize
        - playerPlaybackRate
        - playerPlaying
        - playerCompact
        - playerCurrentTime
        - startedSharingAt
        - stoppedSharingAt
        - updatedAt
      filter:
        meetingId:
          _eq: X-Hasura-MeetingId
    comment: ""
