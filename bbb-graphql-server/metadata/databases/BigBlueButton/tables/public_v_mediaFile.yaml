table:
  name: v_mediaFile
  schema: public
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: mediaFile
  custom_root_fields: {}
select_permissions:
  - role: bbb_client
    permission:
      columns:
        - mediaFileId
        - filename
        - contentType
        - fileSize
        - uploadedAt
      filter:
        meetingId:
          _eq: X-Hasura-MeetingId
    comment: ""
